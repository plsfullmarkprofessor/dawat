<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E4D4A">
<meta name="description" content="DAWAT — Dubai's neighbourhood souq for surplus food. Nothing hits like home.">
<title>DAWAT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#0E4D4A;--teal-dk:#08322F;--saffron:#E8A33D;--cream:#F6F1E7;--card:#FFFDF8;--sand:#F1E6D2;
  --border:#E2D8C6;--dashed:#CDBFA6;--ink:#1C1B19;--muted:#5C574E;--muted2:#6E685D;--mint:#CFE3DF;--alert:#C9561E;
  --top:38px;--bottom:22px;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:#E4DBCB;display:flex;align-items:center;justify-content:center;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea{font-family:inherit}
a{color:var(--teal)}
#phone{width:390px;height:844px;position:relative;overflow:hidden;background:var(--cream);border-radius:46px;box-shadow:0 0 0 10px #1C1B19,0 40px 90px rgba(14,77,74,.35);transform-origin:center;flex:none}
#app{position:absolute;inset:0}
@media (max-width:520px){
  body{display:block;background:var(--cream)}
  #phone{width:100%;height:100%;border-radius:0;box-shadow:none;transform:none!important}
  :root{--top:calc(12px + env(safe-area-inset-top, 0px));--bottom:calc(14px + env(safe-area-inset-bottom, 0px))}
  /* when hosted, the page root already carries the safe-area padding */
  :root.hosted{--top:12px;--bottom:14px}
}

/* animations */
@keyframes bk-spin{0%{transform:rotate(-180deg) scale(.4);opacity:0}45%{opacity:1}70%{transform:rotate(20deg) scale(1.08)}100%{transform:rotate(0) scale(1)}}
@keyframes bk-word{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
@keyframes bk-out{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
@keyframes bk-in{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}
@keyframes bk-slide{0%{opacity:0;transform:translateX(60px)}100%{opacity:1;transform:none}}
@keyframes bk-back{0%{opacity:0;transform:translateX(-40px)}100%{opacity:1;transform:none}}
@keyframes bk-pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,163,61,.55)}50%{box-shadow:0 0 0 10px rgba(232,163,61,0)}}
@keyframes bk-toast{0%{opacity:0;transform:translate(-50%,16px)}100%{opacity:1;transform:translate(-50%,0)}}
@keyframes bk-bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes bk-sheet{0%{transform:translateY(100%)}100%{transform:none}}
@keyframes bk-fade{0%{opacity:0}100%{opacity:1}}
.bk-logo{animation:bk-spin 1.4s cubic-bezier(.2,.8,.2,1) both}
.bk-word{animation:bk-word .6s ease-out 1s both}
.bk-tag{animation:bk-word .6s ease-out 1.25s both}
.bk-splash-out{animation:bk-out .55s ease-in both}
.a-in{animation:bk-in .6s cubic-bezier(.2,.8,.2,1) both}
.a-fwd{animation:bk-slide .45s cubic-bezier(.2,.8,.2,1) both}
.a-back{animation:bk-back .45s cubic-bezier(.2,.8,.2,1) both}
.bk-pulse{animation:bk-pulse 2.2s ease-in-out infinite}
.bk-bump{animation:bk-bump .5s ease-out}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* layout */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--cream)}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.topbar{flex:none;display:flex;align-items:center;gap:8px;padding:var(--top) 16px 12px 12px;border-bottom:1px solid var(--border);background:var(--cream)}
.bottombar{flex:none;padding:12px 20px var(--bottom);background:var(--card);border-top:1px solid var(--border)}

/* type */
.display{font-family:var(--display);font-weight:700;letter-spacing:-.3px}
.t20{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.3px}
.sub{font-size:12px;color:var(--muted2)}
.lbl{font-size:13px;font-weight:600;color:#3D3A34}
h1,h2,h3{margin:0}
h2.sec{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.3px}
h2.small{font-size:16px;font-weight:700}

/* controls */
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:none;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.pill{height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);position:relative}
.field{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--border)}
.field:focus-within{border-color:var(--teal)}
.field input,.field textarea{flex:1;width:100%;min-width:0;border:0;outline:none;background:transparent;font-size:15px;color:var(--ink)}
.field textarea{resize:none;line-height:1.45;padding:12px 0}
input[type=search]::-webkit-search-cancel-button{display:none}
.chip{flex:none;height:44px;padding:0 16px;border-radius:22px;font-size:14px;font-weight:600;white-space:nowrap;background:var(--card);color:var(--ink);border:1px solid var(--border)}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip:hover,.hov:hover{filter:brightness(.97)}
.btn{height:56px;width:100%;border-radius:28px;border:0;background:var(--teal);color:var(--card);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:hover{background:var(--teal-dk)}
.btn-sm{height:44px;padding:0 16px;border-radius:22px;border:0;background:var(--teal);color:var(--card);font-size:13.5px;font-weight:700;flex:none}
.btn-ghost{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-size:13.5px;font-weight:700;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.dot{position:absolute;width:9px;height:9px;border-radius:5px;background:var(--alert);border:2px solid var(--card)}

/* pieces */
.card{background:var(--card);border:1px solid var(--border);border-radius:20px}
.ad{border-radius:14px;border:1.5px dashed var(--dashed);background:#FBF7EF;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#8A8273;letter-spacing:.5px}
.adlbl{font-size:12px;font-weight:600;color:var(--muted2)}
.timer{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;background:var(--sand);font-size:11px;font-weight:700;color:#3D3A34;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:10px;font-size:11.5px;font-weight:700}
.thumb{flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;background-position:center;background-size:cover;background-repeat:no-repeat}
.ticket{position:relative;display:flex;gap:12px;padding:12px;border-radius:20px;background:var(--card);border:1px solid var(--border);cursor:pointer;text-align:left}
.ticket:hover{border-color:var(--dashed)}
.ticket:focus-visible,button:focus-visible,[role=button]:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* nav */
.nav{flex:none;height:calc(70px + var(--bottom));background:var(--card);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:0 8px var(--bottom)}
.tab{height:56px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted2);position:relative}
.tab.on{font-weight:700;color:var(--teal)}
.tab .dot{top:8px;left:calc(50% + 6px)}
.navsell{width:56px;height:56px;margin:-26px auto 0;border-radius:28px;border:4px solid var(--cream);background:var(--saffron);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(14,77,74,.25)}

/* toast + sheet */
.toast{position:absolute;left:50%;bottom:100px;width:calc(100% - 40px);max-width:350px;padding:14px 16px;border-radius:16px;background:var(--ink);color:var(--card);font-size:13.5px;line-height:1.4;display:flex;gap:10px;align-items:center;z-index:20;animation:bk-toast .35s ease-out both;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast button{flex:none;min-width:44px;height:44px;margin:-10px -8px -10px 0;padding:0 8px;border:0;background:none;color:var(--saffron);font-weight:700;font-size:13px}
.scrim{position:absolute;inset:0;background:rgba(28,27,25,.45);z-index:15;animation:bk-fade .25s ease-out both}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(var(--bottom) + 8px);z-index:16;animation:bk-sheet .35s cubic-bezier(.2,.8,.2,1) both;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 4px}

/* chat */
.bubble{max-width:78%;padding:10px 14px;font-size:14.5px;line-height:1.4;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.me{background:var(--teal);color:var(--card);border-bottom-right-radius:6px}
.bubble.them{background:var(--card);color:var(--ink);border:1px solid var(--border);border-bottom-left-radius:6px}
.sysmsg{align-self:center;max-width:88%;text-align:center;padding:8px 12px;border-radius:12px;background:var(--sand);font-size:12.5px;line-height:1.4;color:#3D3A34;font-weight:600}
</style>
</head>

function freshDB() {
  var now = Date.now();
  return {
    v: 2,
    profile: { name: '', area: 'Dubai Marina' },
    tickets: seedTickets(now),
    deals: 0,
    threads: [{ id: 'support', kind: 'support', peer: 'DAWAT Support', unread: 0,
      msgs: [{ me: false, text: 'Hi, welcome to DAWAT! Questions about selling, buying or delivery — just write here.', at: now }] }],
    draft: emptyDraft()
  };
}

function loadDB() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var d = JSON.parse(raw); if (d && d.v === 2) return d; }
  } catch (e) {}
  return freshDB();
}
var db = loadDB();

function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; } catch (e) { return false; }
}

var SELLER_REPLIES = [
  'Perfect, see you then!',
  'Great — I will keep it fresh for you.',
  'Thank you, neighbour. Enjoy it!'
];

var api = {
  tickets: function () { return db.tickets.slice().sort(function (a, b) { return b.at - a.at; }); },
  ticket: function (id) { return db.tickets.find(function (t) { return t.id === id; }); },
  myTickets: function () { return api.tickets().filter(function (t) { return t.mine; }); },
  thread: function (id) { return db.threads.find(function (t) { return t.id === id; }); },
  dealThreads: function () {
    return db.threads.filter(function (t) { return t.kind === 'deal'; })
      .sort(function (a, b) { return last(b).at - last(a).at; });
  },
  unread: function () { return db.threads.reduce(function (n, t) { return n + (t.unread || 0); }, 0); },

  createTicket: function (d) {
    var p = d.price.trim();
    var t = {
      id: 'u' + Date.now(), cat: d.cat || 'pantry', title: d.title.trim(), qty: d.qty.trim() || (d.tray ? 'Serves 6–10' : '1 lot'),
      area: db.profile.area, price: /aed/i.test(p) ? p : 'AED ' + p, delivery: d.delivery, tray: !!d.tray,
      licencePending: d.cat === 'home' && !!d.licensed,
      photos: d.photos.slice(), tint: '#E2D8C6', at: Date.now(), desc: d.desc.trim(), mine: true
    };
    db.tickets.push(t);
    db.draft = emptyDraft();
    if (!persist()) {
      t.photos = t.photos.slice(0, 1); // storage full: keep the cover only
      if (!persist()) { db.tickets.pop(); return null; }
    }
    return t;
  },

  takeDown: function (id) {
    db.tickets = db.tickets.filter(function (t) { return t.id !== id; });
    persist();
  },

  reserve: function (id) {
    var t = api.ticket(id);
    if (!t || t.mine) return null;
    db.tickets = db.tickets.filter(function (x) { return x.id !== id; });
    db.deals += 1;
    var th = {
      id: 'd' + Date.now(), kind: 'deal', unread: 0, replies: 0,
      peer: t.demo ? 'Seller (demo)' : 'Seller',
      rating: { taste: 0, portion: 0 },
      ticket: { cat: t.cat, tray: !!t.tray, verified: !!t.verified, title: t.title, price: t.price, qty: t.qty, area: t.area, delivery: t.delivery, tint: t.tint, cover: (t.photos || [])[0] || '', demo: !!t.demo },
      msgs: [{ sys: true, text: 'You reserved “' + t.title + '” · ' + t.price + '. Agree on a time right here.', at: Date.now() }]
    };
    db.threads.push(th);
    persist();
    var hello = t.delivery === 'courier' ? 'Hi! It’s yours. Send me your address and a good time — I’ll book the courier.'
      : t.delivery === 'self' ? 'Hi! It’s yours. Where should I bring it, and when works for you?'
      : 'Hi neighbour! It’s yours. When suits you to pick it up in ' + t.area + '?';
    setTimeout(function () { api.incoming(th.id, hello); }, 1600);
    return th;
  },

  send: function (threadId, text) {
    var th = api.thread(threadId);
    if (!th) return;
    th.msgs.push({ me: true, text: text, at: Date.now() });
    persist();
    var reply = th.kind === 'support'
      ? 'Thanks! A DAWAT team member will reply here shortly.'
      : SELLER_REPLIES[(th.replies++) % SELLER_REPLIES.length];
    setTimeout(function () { api.incoming(threadId, reply); }, 1200);
  },

  incoming: function (threadId, text) {
    var th = api.thread(threadId);
    if (!th) return;
    th.msgs.push({ me: false, text: text, at: Date.now() });
    var open = ui.screen === 'thread' && ui.threadId === threadId;
    if (!open) th.unread = (th.unread || 0) + 1;
    persist();
    if (!open) flash(th.peer + ': ' + text, 'Open', 'openThread', threadId);
    else render();
  },

  markRead: function (threadId) {
    var th = api.thread(threadId);
    if (th && th.unread) { th.unread = 0; persist(); }
  },

  reset: function () { db = freshDB(); persist(); }
};
function last(th) { return th.msgs[th.msgs.length - 1]; }

var ui = {
  phase: 'spin', screen: 'home', stack: [], anim: '', bump: false,

  toast: null, sheet: '', scrollMem: {}
};

function go(screen, opts) {
  opts = opts || {};
  if (opts.replace) { /* keep stack */ }
  else if (screen === 'home') ui.stack = [];
  else if (opts.tab) ui.stack = ['home'];
  else ui.stack.push(ui.screen);
  if (!opts.keepScroll) delete ui.scrollMem[screen];
  ui.screen = screen;
  ui.anim = opts.anim || (screen === 'home' ? 'back' : 'fwd');
  ui.sheet = '';
  if (!opts.keepToast) ui.toast = null;
  render();
}
function back() {
  var prev = ui.stack.pop() || 'home';
  ui.screen = prev;
  ui.anim = 'back';
  ui.toast = null;
  render();
}

var toastTimer = null;
function flash(msg, label, act, id) {
  ui.toast = { msg: msg, label: label || 'OK', act: act || 'closeToast', id: id || '' };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { ui.toast = null; render(); }, act ? 5200 : 3800);
  render();
}

    '<div class="scroll" data-scroll="ticket">' +
      '<div style="position:relative">' + hero +
        '<button class="iconbtn" data-act="back" aria-label="Back" style="position:absolute;top:calc(var(--top) - 6px);left:12px;background:rgba(255,253,248,.92);box-shadow:0 2px 8px rgba(0,0,0,.12)">' + svg(I.back, 22, '#1C1B19', 2.2) + '</button>' +
        '<span class="timer" style="position:absolute;top:var(--top);right:16px;background:rgba(241,230,210,.95);padding:6px 10px;font-size:12px">' + svg(I.clock, 12, '#3D3A34', 2.6) +
        'Listed <span data-at="' + t.at + '">' + fmtElapsed(Date.now() - t.at) + '</span> ago</span>' +
        (photos.length > 1 ? '<span class="badge" style="position:absolute;bottom:12px;right:16px;background:rgba(28,27,25,.75);color:var(--card)">' + photos.length + ' photos · swipe</span>' : '') +
      '</div>' +

      '<div class="col" style="padding:20px;gap:18px">' +
        '<div class="col" style="gap:8px">' +
          '<div class="row" style="gap:6px;flex-wrap:wrap">' +
            '<span class="badge" style="background:#EAF2F0;color:var(--teal)">' + catLabel(t.cat) + '</span>' +
            (t.tray ? '<span class="badge" style="background:#EAF2F0;color:var(--teal)">' + svg(I.people, 13, '#0E4D4A', 2.2) + 'Family tray</span>' : '') +
            (t.demo ? '<span class="badge" style="background:var(--sand);color:#6B4A12">Demo listing</span>' : '') +
            (t.mine ? '<span class="badge" style="background:var(--sand);color:#6B4A12">Your ticket</span>' : '') +
          '</div>' +
          '<h1 style="font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.6px">' + esc(t.title) + '</h1>' +
          '<span style="font-family:var(--display);font-weight:800;font-size:26px;color:var(--teal)">' + esc(t.price) + '</span>' +
        '</div>' +

        '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">' +
          factTile(I.box, 'Quantity', t.qty) + factTile(I.pin, 'Area', t.area) + factTile(I.truck, 'Delivery', d.short) +
        '</div>' +

        '<div class="card col" style="padding:16px;gap:6px"><h2 class="small">About it</h2>' +
        '<p style="margin:0;font-size:14.5px;line-height:1.5;color:#3D3A34">' + (t.desc ? esc(t.desc) : 'The seller kept it short — ask them anything once you reserve.') + '</p></div>' +

        '<div class="card row" style="padding:14px 16px;gap:12px">' +
          '<span style="flex:none;width:48px;height:48px;border-radius:24px;background:var(--teal);color:var(--saffron);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:17px">' +
          (t.mine ? esc(initials(db.profile.name)) : svg(I.user, 22, '#E8A33D')) + '</span>' +
          '<span class="col" style="gap:2px"><span style="font-weight:700;font-size:15px">' + (t.mine ? 'You' : t.demo ? 'Demo neighbour' : 'A neighbour') + '</span>' +
          '<span style="font-size:12.5px;color:var(--muted)">Neighbour in ' + esc(t.area) + '</span></span>' +
        '</div>' +

        (t.verified ? trustCard(I.shield, 'Verified kitchen', 'Trade licence and Dubai Municipality home-kitchen approval checked by DAWAT.')
          : t.licencePending ? trustCard(I.shield, 'Licence in check', 'DAWAT checks the trade licence and kitchen approval before the Verified badge appears.')
          : '') +

        (t.taste ?
        '<div class="card col" style="padding:14px 16px;gap:10px"><div class="row" style="justify-content:space-between"><h2 class="small">Ratings</h2>' +
        '<span class="sub">' + t.rated + ' buyers' + (t.demo ? ' · demo data' : '') + '</span></div>' +
        ratingBar('Taste', t.taste) + ratingBar('Portion size', t.portion) + '</div>' : '') +

        (t.mine ? '' :
        '<div class="col" style="gap:10px"><h2 class="small">How it works</h2>' +
          step(1, 'Reserve it', 'It comes off the souq and is held for you.') +
          step(2, 'Chat with the seller', 'Your conversation opens instantly — agree on a time.') +
          step(3, d.id === 'pickup' ? 'Collect it and enjoy' : 'Receive it and enjoy', 'Good food, a second table, a happy neighbour.') +
        '</div>') +

        (t.demo ? '<p class="sub" style="margin:0;line-height:1.45">This is an example ticket for the DAWAT prototype — not a real seller.</p>' : '') +
      '</div>' +
    '</div>' +

    '<div class="bottombar row" style="gap:14px">' +
      (t.mine
        ? '<button class="btn" data-act="takeDown" data-id="' + t.id + '" style="background:var(--card);color:var(--ink);border:1px solid var(--border)">' + svg(I.trash, 20, '#C9561E') + 'Take it down</button>'
        : '<div class="col" style="flex:none"><span class="sub">Total</span><span style="font-family:var(--display);font-weight:800;font-size:20px;color:var(--teal);white-space:nowrap">' + esc(t.price) + '</span></div>' +
          '<button class="btn" data-act="reserve" data-id="' + t.id + '" data-from="ticket">Reserve it' + svg(I.arrow, 20, '#E8A33D', 2.4) + '</button>') +
    '</div>' +
  '</section>';
}
function trustCard(icon, title, text) {
  return '<div class="row" style="gap:12px;padding:14px 16px;border-radius:20px;background:#EAF2F0;border:1px solid #CFE3DF;align-items:flex-start">' +
    '<span style="flex:none;margin-top:1px">' + svg(icon, 22, '#0E4D4A') + '</span><span class="col" style="gap:2px">' +
    '<span style="font-weight:700;font-size:14.5px;color:var(--teal)">' + title + '</span><span style="font-size:12.5px;color:var(--muted);line-height:1.4">' + text + '</span></span></div>';
}
function ratingBar(label, v) {
  return '<div class="row" style="gap:10px"><span style="width:92px;font-size:13px;font-weight:600">' + label + '</span>' +
    '<span style="flex:1;height:8px;border-radius:4px;background:var(--sand);overflow:hidden"><span style="display:block;height:100%;width:' + (v / 5 * 100) + '%;background:var(--saffron)"></span></span>' +
    '<span class="row" style="gap:3px;width:42px;justify-content:flex-end;font-weight:700;font-size:13px">' + star(true, 12) + v.toFixed(1) + '</span></div>';
}
function factTile(icon, label, value) {
  return '<div class="card col" style="padding:12px;gap:4px;border-radius:16px">' + svg(icon, 18, '#0E4D4A') +
    '<span class="sub" style="font-size:11px">' + label + '</span><span style="font-size:13.5px;font-weight:700;line-height:1.25">' + esc(value) + '</span></div>';
}
function step(n, title, text) {
  return '<div class="row" style="gap:12px;align-items:flex-start"><span style="flex:none;width:28px;height:28px;border-radius:14px;background:var(--sand);color:#6B4A12;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center">' + n + '</span>' +
    '<span class="col" style="gap:2px"><span style="font-weight:700;font-size:14px">' + title + '</span><span style="font-size:12.5px;color:var(--muted);line-height:1.4">' + text + '</span></span></div>';
}

/* SELL */
function sellScreen() {
  var d = db.draft;
  var slots = [];
  for (var i = 0; i < 6; i++) {
    if (i < d.photos.length) {
      slots.push('<div style="position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:#E2D8C6 center/cover no-repeat;background-image:url(' + d.photos[i] + ')">' +
        (i === 0 ? '<span style="position:absolute;left:8px;bottom:8px;padding:3px 8px;border-radius:8px;background:var(--ink);color:var(--card);font-size:10.5px;font-weight:700">Cover</span>' : '') +
        '<button data-act="removePhoto" data-id="' + i + '" aria-label="Remove photo" style="position:absolute;top:2px;right:2px;width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center">' +
        '<span style="width:24px;height:24px;border-radius:12px;background:rgba(28,27,25,.75);display:flex;align-items:center;justify-content:center">' + svg(I.x, 12, '#FFFDF8', 3) + '</span></button></div>');
    } else {
      var next = i === d.photos.length;
      var col = next ? '#0E4D4A' : '#8A8273';
      slots.push('<label style="aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;' +
        (next ? 'background:var(--card);border:2px dashed var(--teal)' : 'background:#FBF7EF;border:1.5px dashed var(--dashed)') + '">' +
        '<input type="file" accept="image/*" multiple data-act="addPhoto" class="sr">' + svg(I.plus, 26, col, 2.4) +
        '<span style="font-size:11px;font-weight:600;color:' + col + '">' + (i === 0 ? 'Cover photo' : 'Add photo') + '</span></label>');
    }
  }
  return '<section class="screen ' + animClass() + '" style="z-index:3">' +
    '<div class="topbar"><button class="iconbtn" data-act="back" aria-label="Back">' + svg(I.back, 22, '#1C1B19', 2.2) + '</button>' +
    '<div class="col" style="flex:1"><span class="t20">New sale ticket</span><span class="sub">Draft · saved as you type</span></div></div>' +

    '<div class="scroll" data-scroll="sell" style="padding:20px;display:flex;flex-direction:column;gap:22px">' +
      '<div class="col" style="gap:10px"><div class="row" style="justify-content:space-between;align-items:baseline"><h2 class="small">Photos</h2>' +
      '<span style="font-size:12.5px;font-weight:600;color:var(--teal)">' + d.photos.length + ' / 6</span></div>' +
      '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">' + slots.join('') + '</div>' +
      '<span style="font-size:12.5px;color:var(--muted);line-height:1.4">Bright daylight photos help buyers say yes faster.</span></div>' +

      '<div class="col" style="gap:14px"><h2 class="small">About your product</h2>' +
        '<label class="col" style="gap:6px"><span class="lbl">Title</span><span class="field"><input type="text" data-field="title" maxlength="80" value="' + esc(d.title) + '" placeholder="e.g. Fresh hammour, caught today"></span></label>' +
        '<div class="col" style="gap:6px"><span class="lbl">Category</span><div class="row" style="flex-wrap:wrap;gap:8px">' +
        CATS.filter(function (c) { return c.id !== 'all'; }).map(function (c) {
          return '<button class="chip' + (d.cat === c.id ? ' on' : '') + '" data-act="sellCat" data-id="' + c.id + '" aria-pressed="' + (d.cat === c.id) + '">' + c.label + '</button>';
        }).join('') + '</div></div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
          '<label class="col" style="gap:6px"><span class="lbl">Quantity</span><span class="field"><input type="text" data-field="qty" maxlength="30" value="' + esc(d.qty) + '" placeholder="e.g. 4 kg, 20 jars"></span></label>' +
          '<label class="col" style="gap:6px"><span class="lbl">Price</span><span class="field" style="gap:6px"><span style="font-size:14px;font-weight:700;color:var(--teal)">AED</span>' +
          '<input type="text" inputmode="decimal" data-field="price" maxlength="20" value="' + esc(d.price) + '" placeholder="0"></span></label>' +
        '</div>' +
        toggleCard('tray', d.tray, I.people, 'Offer it as a family tray', 'Serves 6–10 — popular for gatherings and office lunches') +
        (d.cat === 'home' ? toggleCard('licensed', d.licensed, I.shield, 'My home kitchen is licensed', 'Trade licence + Dubai Municipality approval. We check it, then add the Verified badge.') : '') +
        '<label class="col" style="gap:6px"><span class="lbl">Description</span><span class="field" style="align-items:stretch"><textarea rows="4" data-field="desc" maxlength="600" placeholder="When was it made or caught? How is it stored? What makes it special?">' + esc(d.desc) + '</textarea></span>' +
        '<span class="sub">Tell the story — buyers trust sellers who share details.</span></label>' +
        '<div class="col" style="gap:8px"><span class="lbl">Delivery</span>' + DELIVERIES.map(function (o) {
          var on = d.delivery === o.id;
          return '<button data-act="delivery" data-id="' + o.id + '" aria-pressed="' + on + '" style="display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 14px;border-radius:16px;text-align:left;background:' + (on ? '#EAF2F0' : 'var(--card)') + ';border:' + (on ? '2px solid var(--teal)' : '1px solid var(--border)') + '">' +
            '<span style="flex:none;width:20px;height:20px;border-radius:10px;background:var(--card);border:' + (on ? '6px solid var(--teal)' : '2px solid #A39A8A') + '"></span>' +
            '<span class="col" style="gap:2px"><span style="font-size:14.5px;font-weight:700">' + o.label + '</span><span style="font-size:12.5px;color:var(--muted)">' + o.sub + '</span></span></button>';
        }).join('') + '</div>' +
        '<div class="card row" style="padding:12px 14px;gap:10px;border-radius:16px">' + svg(I.pin, 18, '#0E4D4A') +
        '<span style="flex:1;font-size:13.5px">Listed in <b>' + esc(db.profile.area) + '</b></span><button class="btn-ghost" data-act="openArea" style="height:36px;font-size:12.5px">Change</button></div>' +
      '</div>' +
    '</div>' +
    '<div class="bottombar"><button class="btn" data-act="publish">Put it on the table' + svg(I.arrow, 20, '#E8A33D', 2.4) + '</button></div>' +
  '</section>';
}

function toggleCard(key, on, icon, title, sub) {
  return '<button data-act="toggleDraft" data-id="' + key + '" role="switch" aria-checked="' + on + '" style="display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 14px;border-radius:16px;text-align:left;background:' +
    (on ? '#EAF2F0' : 'var(--card)') + ';border:' + (on ? '2px solid var(--teal)' : '1px solid var(--border)') + '">' +
    '<span style="flex:none">' + svg(icon, 22, '#0E4D4A') + '</span>' +
    '<span class="col" style="flex:1;gap:2px"><span style="font-size:14.5px;font-weight:700">' + title + '</span><span style="font-size:12.5px;color:var(--muted);line-height:1.35">' + sub + '</span></span>' +
    '<span style="flex:none;width:44px;height:26px;border-radius:13px;padding:3px;background:' + (on ? 'var(--teal)' : '#D8CEBC') + ';display:flex;justify-content:' + (on ? 'flex-end' : 'flex-start') + '">' +
    '<span style="width:20px;height:20px;border-radius:10px;background:var(--card)"></span></span></button>';
}

/* CHATS */
function chatsScreen() {
  var support = api.thread('support');
  var deals = api.dealThreads();
  return '<section class="screen ' + animClass() + '" style="z-index:3">' +
    '<div class="topbar"><button class="pill" data-act="goHome" aria-label="Exit chats" style="font-size:14px;font-weight:700;padding:0 14px 0 10px">' + svg(I.exit, 18, '#1C1B19', 2.2) + 'Exit</button>' +
    '<span class="t20" style="flex:1;text-align:right">Chats</span></div>' +
    '<div class="scroll" data-scroll="chats" style="padding:16px;display:flex;flex-direction:column;gap:12px">' +
      chatRow(support) + deals.map(chatRow).join('') +
      (deals.length ? '' :
      '<div class="col" style="flex:1;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center">' + svg(I.chatLines, 56, '#CDBFA6', 1.4) +
      '<span style="font-size:15px;font-weight:700;color:#3D3A34">No chats yet</span>' +
      '<span style="font-size:13px;line-height:1.45;color:var(--muted2)">When you reserve food or someone wants yours, your conversation will start here.</span>' +
      '<button class="btn-sm" data-act="openBuy" style="margin-top:6px">Find something good</button></div>') +
    '</div></section>';
}
function chatRow(th) {
  var l = last(th);
  var avatar = th.kind === 'support'
    ? '<span style="flex:none;width:48px;height:48px;border-radius:24px;background:var(--teal);display:flex;align-items:center;justify-content:center">' + svg(I.headset, 24, '#E8A33D') + '</span>'
    : '<span class="thumb" style="' + thumbStyle(th.ticket, 48) + 'border-radius:24px">' + thumbIcon(th.ticket, 20) + '</span>';
  return '<button data-act="openThread" data-id="' + th.id + '" class="hov" style="display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:72px;border-radius:18px;border:1px solid var(--border);background:var(--card);text-align:left;width:100%">' + avatar +
    '<span class="col" style="flex:1;min-width:0;gap:3px"><span class="row" style="justify-content:space-between;gap:8px">' +
    '<span style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(th.kind === 'support' ? 'DAWAT Support' : th.ticket.title) + '</span>' +
    '<span style="flex:none;font-size:11.5px;font-weight:600;color:var(--teal)">' + (th.kind === 'support' ? 'Online' : fmtClock(l.at)) + '</span></span>' +
    '<span class="row" style="gap:8px"><span style="flex:1;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;' + (th.unread ? 'font-weight:700;color:var(--ink)' : '') + '">' +
    esc((l.me ? 'You: ' : '') + l.text) + '</span>' +
    (th.unread ? '<span style="flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--alert);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">' + th.unread + '</span>' : '') +
    '</span></span></button>';
}

function threadScreen() {
  var th = api.thread(ui.threadId);
  if (!th) return chatsScreen();
  var isSupport = th.kind === 'support';
  var head = isSupport
    ? '<span style="flex:none;width:40px;height:40px;border-radius:20px;background:var(--teal);display:flex;align-items:center;justify-content:center">' + svg(I.headset, 20, '#E8A33D') + '</span>' +
      '<span class="col"><span style="font-size:15.5px;font-weight:700">DAWAT Support</span><span style="font-size:12px;color:var(--teal);font-weight:600">Online · usually replies fast</span></span>'
    : '<span class="thumb" style="' + thumbStyle(th.ticket, 40) + 'border-radius:20px">' + thumbIcon(th.ticket, 18) + '</span>' +
      '<span class="col" style="min-width:0"><span style="font-size:15.5px;font-weight:700">' + esc(th.peer) + '</span><span style="font-size:12px;color:var(--teal);font-weight:600">' + esc(th.ticket.area) + ' · ' + delivery(th.ticket.delivery).short + '</span></span>';

  var deal = isSupport ? '' :
    '<div class="card row" style="padding:10px 12px;gap:10px;border-radius:16px">' +
    '<span class="thumb" style="' + thumbStyle(th.ticket, 44) + 'border-radius:12px">' + thumbIcon(th.ticket, 18) + '</span>' +
    '<span class="col" style="flex:1;min-width:0;gap:2px"><span style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(th.ticket.title) + '</span>' +
    '<span style="font-size:12.5px;color:var(--muted)">' + esc(th.ticket.qty) + ' · <b style="color:var(--teal)">' + esc(th.ticket.price) + '</b></span></span>' +
    '<span class="badge" style="background:#EAF2F0;color:var(--teal)">' + svg(I.check, 12, '#0E4D4A', 3) + 'Reserved</span></div>';

  return '<section class="screen ' + animClass() + '" style="z-index:4">' +
    '<div class="topbar" style="gap:10px"><button class="iconbtn" data-act="back" aria-label="Back to chats">' + svg(I.back, 22, '#1C1B19', 2.2) + '</button>' + head + '</div>' +
    '<div class="scroll" data-scroll="thread" style="padding:16px;display:flex;flex-direction:column;gap:10px">' + deal +
    th.msgs.map(function (m) {
      if (m.sys) return '<div class="sysmsg">' + esc(m.text) + '</div>';
      return '<div style="display:flex;justify-content:' + (m.me ? 'flex-end' : 'flex-start') + '"><div class="bubble ' + (m.me ? 'me' : 'them') + '">' + esc(m.text) + '</div></div>';
    }).join('') +
    rateCard(th) +
    (th.ticket && th.ticket.demo ? '<p class="sub" style="text-align:center;margin:6px 0 0">Demo chat — replies are automatic in this prototype.</p>' : '') +
    '</div>' +
    '<div class="row" style="flex:none;gap:8px;padding:10px 12px var(--bottom);background:var(--card);border-top:1px solid var(--border)">' +
      '<label class="field" style="flex:1;height:48px;min-height:48px;border-radius:24px;background:var(--cream)"><span class="sr">Message</span>' +
      '<input type="text" enterkeyhint="send" data-field="msg" value="' + esc(ui.msg) + '" placeholder="Write a message…"></label>' +
      '<button data-act="send" aria-label="Send" style="flex:none;width:48px;height:48px;border-radius:24px;border:0;background:var(--teal);display:flex;align-items:center;justify-content:center">' + svg(I.send, 20, '#FFFDF8', 2.2) + '</button>' +
    '</div></section>';
}

// After the seller has replied, the buyer can rate taste and portion size.
function rateCard(th) {
  if (th.kind !== 'deal' || !th.msgs.some(function (m) { return !m.me && !m.sys; })) return '';
  var r = th.rating || { taste: 0, portion: 0 };
  var done = r.taste && r.portion;
  var row = function (k, label) {
    var stars = '';
    for (var n = 1; n <= 5; n++) {
      stars += '<button data-act="rate" data-k="' + k + '" data-v="' + n + '" aria-label="' + label + ' ' + n + ' of 5" style="width:36px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;padding:0">' + star(n <= r[k], 24) + '</button>';
    }
    return '<div class="row" style="justify-content:space-between"><span style="font-size:13.5px;font-weight:600">' + label + '</span><span class="row">' + stars + '</span></div>';
  };
  return '<div class="card col" style="padding:12px 14px;gap:4px;margin-top:6px;border-radius:18px">' +
    '<span style="font-weight:700;font-size:14.5px">' + (done ? 'Thanks — your rating helps neighbours choose.' : 'Got it? Rate it for your neighbours') + '</span>' +
    row('taste', 'Taste') + row('portion', 'Portion size') + '</div>';
}

/* PROFILE */
function profileScreen() {
  var p = db.profile;
  var mine = api.myTickets();
  var deals = api.dealThreads();
  return '<section class="screen ' + animClass() + '">' +
    '<div class="scroll" data-scroll="profile" style="padding:var(--top) 20px 28px;display:flex;flex-direction:column;gap:22px">' +
      '<div class="row" style="justify-content:space-between"><h1 class="t20" style="font-size:24px">Profile</h1>' +
      '<span class="badge" style="background:var(--sand);color:#6B4A12">' + svg(I.pin, 13, '#6B4A12', 2.4) + esc(p.area) + '</span></div>' +

      '<div style="border-radius:24px;background:var(--teal);color:var(--card);padding:18px;display:flex;flex-direction:column;gap:14px">' +
        '<div class="row" style="gap:14px">' +
          '<span style="flex:none;width:64px;height:64px;border-radius:32px;background:var(--saffron);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:24px" data-initials>' + esc(initials(p.name)) + '</span>' +
          '<label class="col" style="flex:1;min-width:0;gap:4px"><span style="font-size:12px;font-weight:600;color:var(--mint)">Your name on DAWAT</span>' +
          '<span class="row" style="gap:6px;border-bottom:1.5px solid rgba(207,227,223,.5);padding-bottom:4px">' +
          '<input type="text" data-field="name" maxlength="40" value="' + esc(p.name) + '" placeholder="Add your name" style="flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--card);font-family:var(--display);font-weight:700;font-size:20px">' +
          svg(I.edit, 16, '#CFE3DF') + '</span></label>' +
        '</div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">' +
          stat(mine.length, 'live tickets') + stat(deals.length, 'reserved') + stat(db.deals, 'deals on DAWAT') +
        '</div>' +
      '</div>' +

      '<div class="col" style="gap:10px"><div class="row" style="justify-content:space-between;align-items:baseline"><h2 class="sec">Your tickets</h2>' +
      (mine.length ? '<button class="btn-ghost" data-act="openSell" style="height:36px;font-size:12.5px">+ New</button>' : '') + '</div>' +
      (mine.length ? '<div class="col" style="gap:12px">' + mine.map(ticketCard).join('') + '</div>'
        : emptyCard('Your kitchen has something extra?', 'Put it on the table — buyers nearby can see it the moment you post.', 'openSell', 'Sell something')) +
      '</div>' +

      '<div class="col" style="gap:10px"><h2 class="sec">Your reservations</h2>' +
      (deals.length ? '<div class="col" style="gap:10px">' + deals.map(chatRow).join('') + '</div>'
        : emptyCard('Nothing reserved yet', 'Imagine tonight’s dinner coming from a neighbour’s kitchen. Have a look.', 'openBuy', 'Find something good')) +
      '</div>' +

      '<div class="col" style="gap:10px"><h2 class="sec">Neighbourhood</h2><span class="sub" style="margin-top:-4px">Your new tickets are listed here.</span>' +
      '<div class="row" style="flex-wrap:wrap;gap:8px">' + AREAS.map(function (a) {
        return '<button class="chip' + (a === p.area ? ' on' : '') + '" data-act="pickArea" data-id="' + esc(a) + '" aria-pressed="' + (a === p.area) + '">' + esc(a) + '</button>';
      }).join('') + '</div></div>' +

      '<div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn-ghost row" data-act="openThread" data-id="support" style="gap:6px">' + svg(I.headset, 16, '#0E4D4A') + 'Talk to support</button>' +
      '<button class="btn-ghost row" data-act="askReset" style="gap:6px">' + svg(I.refresh, 16, '#C9561E') + 'Reset demo</button></div>' +

      '<div class="row" style="justify-content:space-between;padding-top:4px"><span class="sub">Nothing hits like home.</span>' + inventorsLink('var(--muted2)') + '</div>' +
    '</div>' + nav('profile') + '</section>';
}
function stat(n, label) {
  return '<div style="border-radius:16px;background:rgba(255,253,248,.1);padding:10px;display:flex;flex-direction:column;gap:2px">' +
    '<span style="font-family:var(--display);font-weight:800;font-size:22px">' + n + '</span><span style="font-size:11.5px;color:var(--mint);line-height:1.2">' + label + '</span></div>';
}
function emptyCard(title, text, act, label) {
  return '<div style="padding:20px;border-radius:20px;border:1.5px dashed var(--dashed);text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center">' +
    '<span style="font-weight:700;font-size:15px">' + title + '</span><span style="font-size:13px;color:var(--muted);line-height:1.4">' + text + '</span>' +
    '<button class="btn-sm" data-act="' + act + '" style="margin-top:4px">' + label + '</button></div>';
}

/* overlays */
function areaSheet() {
  return '<div class="scrim" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-label="Choose your neighbourhood"><div class="grab"></div>' +
    '<div class="col" style="gap:4px"><span class="t20">Where’s home?</span><span style="font-size:13px;color:var(--muted)">Your new tickets will be listed in this neighbourhood.</span></div>' +
    '<div class="row" style="flex-wrap:wrap;gap:8px">' + AREAS.map(function (a) {
      return '<button class="chip' + (a === db.profile.area ? ' on' : '') + '" data-act="pickArea" data-id="' + esc(a) + '">' + esc(a) + '</button>';
    }).join('') + '</div></div>';
}
function toastHtml() {
  var t = ui.toast;
  return '<div class="toast" role="status"><span style="flex:1">' + esc(t.msg) + '</span><button data-act="' + t.act + '" data-id="' + esc(t.id) + '">' + esc(t.label) + '</button></div>';
}

/* ---------------- render ---------------- */

var $app = document.getElementById('app');
var SCREENS = { home: homeScreen, buy: buyScreen, ticket: ticketScreen, sell: sellScreen, chats: chatsScreen, thread: threadScreen, profile: profileScreen };

function render() {
  // remember focus + scroll so a re-render never disturbs typing
  var a = document.activeElement, focus = null;
  if (a && a.dataset && a.dataset.field) {
    focus = { f: a.dataset.field };
    try { focus.s = a.selectionStart; focus.e = a.selectionEnd; } catch (e) {}
  }
  $app.querySelectorAll('[data-scroll]').forEach(function (el) { ui.scrollMem[el.dataset.scroll] = el.scrollTop; });

  $app.innerHTML = (SCREENS[ui.screen] || homeScreen)() + (ui.sheet === 'area' ? areaSheet() : '') + (ui.toast ? toastHtml() : '');

  $app.querySelectorAll('[data-scroll]').forEach(function (el) {
    var k = el.dataset.scroll;
    if (k === 'thread') el.scrollTop = el.scrollHeight;
    else if (ui.scrollMem[k] != null) el.scrollTop = ui.scrollMem[k];
  });
  if (focus) {
    var el = $app.querySelector('[data-field="' + focus.f + '"]');
    if (el) { el.focus({ preventScroll: true }); try { if (focus.s != null) el.setSelectionRange(focus.s, focus.e); } catch (e) {} }
  }
  ui.anim = '';
  ui.bump = false;
}

/* ---------------- actions ---------------- */

var A = {
  noop: function (d, el, e) { e.preventDefault(); },
  replay: function () { runIntro(); },
  closeToast: function () { clearTimeout(toastTimer); ui.toast = null; render(); },
  goHome: function () { go('home'); },
  back: function () { back(); },
  tab: function (d) {
    if (d.id === 'home') go('home', { anim: 'in' });
    else if (d.id === 'explore') { ui.q = ''; ui.buyCat = 'all'; go('buy', { tab: true }); }
    else if (d.id === 'chats') go('chats', { tab: true });
    else if (d.id === 'profile') go('profile', { tab: true, anim: 'in' });
  },
  openSell: function () { go('sell'); },
  openBuy: function () { ui.q = ''; ui.buyCat = 'all'; ui.trays = false; go('buy'); },
  browseCat: function (d) { ui.q = ''; ui.buyCat = d.id; ui.trays = false; go('buy'); },
  buyCat: function (d) { ui.buyCat = d.id; render(); },
  toggleTrays: function () { ui.trays = !ui.trays; render(); },
  toggleDraft: function (d) { db.draft[d.id] = !db.draft[d.id]; persist(); render(); },
  rate: function (d) {
    var th = api.thread(ui.threadId);
    if (!th) return;
    th.rating = th.rating || { taste: 0, portion: 0 };
    th.rating[d.k] = +d.v;
    persist(); render();
  },
  clearQ: function () { ui.q = ''; render(); var el = $app.querySelector('[data-field="q"]'); if (el) el.focus(); },
  openTicket: function (d) { ui.ticketId = d.id; go('ticket'); },
  openArea: function () { ui.sheet = 'area'; render(); },
  closeSheet: function () { ui.sheet = ''; render(); },
  pickArea: function (d) {
    db.profile.area = d.id; persist(); ui.sheet = '';
    flash('Home is ' + d.id + ' now — your new tickets will be listed there.');
  },
  bell: function () {
    var u = api.unread();
    if (u) go('chats');
    else flash('All quiet for now. We’ll ping you the moment a neighbour replies.');
  },
  dealsInfo: function () { flash(db.deals + (db.deals === 1 ? ' deal' : ' deals') + ' closed by neighbours on DAWAT.'); },

  reserve: function (d) {
    var th = api.reserve(d.id);
    if (!th) return;
    ui.bump = true;
    if (d.from === 'ticket') { ui.stack.pop(); ui.screen = 'buy'; ui.anim = 'back'; }
    flash('Deal closed! Your chat with the seller is open.', 'Open chat', 'openThread', th.id);
  },
  takeDown: function (d) {
    api.takeDown(d.id);
    back();
    flash('Taken down. Put it back on the table any time.');
  },

  openThread: function (d) {
    clearTimeout(toastTimer);
    ui.threadId = d.id; ui.msg = '';
    api.markRead(d.id);
    // back from a chat lands on the chat list, unless it was opened from Profile
    if (ui.screen !== 'chats' && ui.screen !== 'profile') { ui.stack.push(ui.screen); ui.screen = 'chats'; }
    go('thread');
  },
  send: function () { sendMsg(); },

  sellCat: function (d) { db.draft.cat = d.id; persist(); render(); },
  delivery: function (d) { db.draft.delivery = d.id; persist(); render(); },
  removePhoto: function (d) { db.draft.photos.splice(+d.id, 1); persist(); render(); },
  publish: function () {
    var d = db.draft;
    if (!d.photos.length) return flash('Add at least one photo — buyers want to see it.');
    if (!d.title.trim()) return flash('Give it a title so neighbours can find it.');
    if (!d.price.trim()) return flash('Set your price in AED.');
    if (d.cat === 'home' && !d.licensed) return flash('Home-cooked meals go up once your kitchen is licensed — switch it on when yours is approved.');
    var t = api.createTicket(d);
    if (!t) return flash('Your phone is out of space for photos — try fewer or smaller ones.');
    ui.q = ''; ui.buyCat = 'all';
    go('buy', { replace: true, keepToast: true });
    flash('Your ticket is live — it is at the top of the list now.');
  },

  askReset: function () { flash('Start the demo fresh? Your tickets and chats will be cleared.', 'Reset', 'doReset'); },
  doReset: function () {
    api.reset();
    ui.q = ''; ui.buyCat = 'all'; ui.homeQ = ''; ui.stack = [];
    ui.toast = null; ui.screen = 'home';
    runIntro();
  }
};

function sendMsg() {
  var text = ui.msg.trim();
  if (!text) return;
  ui.msg = '';
  api.send(ui.threadId, text);
  render();
}

$app.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT') return;
  var fn = A[el.dataset.act];
  if (fn) fn(el.dataset, el, e);
});

$app.addEventListener('keydown', function (e) {
  var t = e.target;
  if (e.key === 'Enter' && t.getAttribute('role') === 'button') { e.preventDefault(); t.click(); return; }
  if (e.key !== 'Enter' || !t.dataset) return;
  if (t.dataset.field === 'homeQ') { ui.q = ui.homeQ.trim(); ui.buyCat = 'all'; ui.homeQ = ''; t.blur(); go('buy'); }
  else if (t.dataset.field === 'q') t.blur();
  else if (t.dataset.field === 'msg') { e.preventDefault(); sendMsg(); }
});

var saveTimer = null;
$app.addEventListener('input', function (e) {
  var f = e.target.dataset && e.target.dataset.field;
  if (!f) return;
  var v = e.target.value;
  if (f === 'q') { ui.q = v; render(); }
  else if (f === 'homeQ') ui.homeQ = v;
  else if (f === 'msg') ui.msg = v;
  else if (f === 'name') {
    db.profile.name = v;
    $app.querySelectorAll('[data-initials]').forEach(function (el) { el.textContent = initials(v); });
    clearTimeout(saveTimer); saveTimer = setTimeout(persist, 300);
  }
  else if (f in db.draft) { db.draft[f] = v; clearTimeout(saveTimer); saveTimer = setTimeout(persist, 300); }
});

$app.addEventListener('change', function (e) {
  if (!e.target.dataset || e.target.dataset.act !== 'addPhoto') return;
  var files = Array.prototype.slice.call(e.target.files || [], 0, 6 - db.draft.photos.length);
  if (!files.length) return;
  Promise.all(files.map(function (f) { return compress(f).catch(function () { return null; }); })).then(function (urls) {
    var ok = urls.filter(Boolean);
    ok.forEach(function (u) { if (db.draft.photos.length < 6) db.draft.photos.push(u); });
    if (!persist()) { db.draft.photos.splice(db.draft.photos.length - ok.length, ok.length); flash('Your phone is out of space for photos — try fewer or smaller ones.'); return; }
    if (ok.length < urls.length) flash('One photo didn’t open — a JPG or PNG works best.');
    else render();
  });
});

function compress(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var max = 900, s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(); };
    img.src = url;
  });
}

// flush a pending debounced save if the page is closed mid-typing
window.addEventListener('pagehide', function () { if (saveTimer) { clearTimeout(saveTimer); persist(); } });

/* live timers: update text only, no re-render */
setInterval(function () {
  var now = Date.now();
  $app.querySelectorAll('[data-at]').forEach(function (el) { el.textContent = fmtElapsed(now - +el.dataset.at); });
}, 1000);

/* ---------------- splash ---------------- */

var introTimers = [];
function runIntro() {
  introTimers.forEach(clearTimeout); introTimers = [];
  var old = document.getElementById('splash'); if (old) old.remove();
  ui.phase = 'spin'; ui.screen = 'home'; ui.stack = []; ui.sheet = '';
  render();
  var s = document.createElement('div');
  s.id = 'splash';
  s.setAttribute('aria-hidden', 'true');
  s.style.cssText = 'position:absolute;inset:0;background:#0E4D4A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:30';
  s.innerHTML = '<span class="bk-logo" style="display:flex">' + logo(120, true) + '</span>' +
    '<div class="bk-word" style="font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:2px;color:#F6F1E7">DAWAT</div>' +
    '<div class="bk-tag" style="font-size:14px;font-weight:500;color:#CFE3DF;letter-spacing:.2px">Nothing hits like home.</div>';
  document.getElementById('phone').appendChild(s);
  introTimers.push(setTimeout(function () { ui.phase = 'out'; s.classList.add('bk-splash-out'); ui.anim = 'in'; render(); }, 2100));
  introTimers.push(setTimeout(function () { ui.phase = 'home'; s.remove(); }, 2650));
}

/* fit the phone frame to desktop windows */
function fit() {
  var ph = document.getElementById('phone');
  // a host that pads the page root for the notch already clears it; don't add the inset twice
  var cs = getComputedStyle(document.documentElement);
  if ((parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0) > 0) document.documentElement.classList.add('hosted');
  if (window.innerWidth <= 520) { ph.style.transform = ''; return; }
  var s = Math.min(1, (window.innerHeight - 48) / 864, (window.innerWidth - 48) / 410);
  ph.style.transform = s < 1 ? 'scale(' + s + ')' : '';
}
window.addEventListener('resize', fit);
fit();
runIntro();
</script>
